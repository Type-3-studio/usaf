# Credential Dumping Correlation Rule (YAML-defined)
# Detects systems where attackers have dumped credentials from
# multiple sources: /etc/shadow access, cloud credentials, API keys.
---
id: CRED-DUMP
name: Credential Dumping Detection
description: >
  Detects credential harvesting by correlating exposed credentials
  across multiple categories. Attackers often dump all credentials
  from a compromised system.
severity_score: 10.0
min_signal_count: 2
tags:
  - credentials
  - dumping
  - harvesting
mitre_attack_ids:
  - T1003
  - T1552
  - T1525
cis_benchmarks:
  - CIS Ubuntu 22.04: 5.4
kill_chain_phases:
  - credential-access
  - collection
conditions:
  - check_ids:
      - SECR-101
      - SECR-102
    min_count: 1
  - check_ids:
      - SECR-201
      - SECR-202
      - SECR-203
      - SECR-401
    min_count: 1
  - check_ids:
      - SECR-301
      - SECR-302
    min_count: 1
output:
  title: Credential Dumping Detection
  description: >
    Found exposed credentials from multiple categories. This pattern
    is consistent with post-compromise credential harvesting.
  rationale: >
    Attackers who gain access to a system typically dump all available
    credentials to enable lateral movement and privilege escalation.
    Finding credentials from multiple categories (cloud, SSH, apps,
    databases) on the same system strongly indicates active compromise.
  remediation: >
    1. IMMEDIATE: Rotate ALL credentials found on this system
    2. Review system for unauthorized access
    3. Implement a secrets management solution
    4. Enable file integrity monitoring for credential files
    5. Audit recent authentication events
