# Privilege Escalation Detection (YAML-defined)
# Detects systems where privilege escalation is possible through
# multiple vectors: SUID binaries, world-writable files, root services.
---
id: PRIVESC-PATH
name: Privilege Escalation Path Detection
description: >
  Detects systems with multiple privilege escalation vectors,
  including SUID binaries, world-writable sensitive files, and
  services running as root.
severity_score: 8.0
min_signal_count: 2
tags:
  - privilege-escalation
  - suid
  - root
mitre_attack_ids:
  - T1548
  - T1548.001
  - T1574
cis_benchmarks:
  - CIS Ubuntu 22.04: 1.7
kill_chain_phases:
  - privilege-escalation
  - persistence
conditions:
  - check_ids:
      - PRM-101
    evidence_type: FileEvidence
    field_matches:
      path: /usr/bin/*
    min_count: 1
  - check_ids:
      - PRM-201
    evidence_type: FileEvidence
    min_count: 1
  - check_ids:
      - SVC-201
    min_count: 1
output:
  title: Multiple Privilege Escalation Vectors Detected
  description: >
    Found privilege escalation vectors across multiple categories.
  rationale: >
    Multiple independent privilege escalation vectors on the same
    system significantly increase the likelihood that a local attacker
    can gain root access. Each vector type requires different exploit
    techniques, so the presence of multiple types raises the overall risk.
  remediation: >
    1. Audit SUID binaries: find / -perm -4000 -ls
    2. Remove world-writable permissions from sensitive files
    3. Reduce services running as root where possible
    4. Use capabilities instead of SUID where applicable
