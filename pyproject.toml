[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usaf"
version = "0.23.0"
description = "Ubuntu Security Audit Framework - Production-grade security auditing for Ubuntu Linux"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Type-3 Studio"},
]
maintainers = [
    {name = "Yasser", email = "yasser@type3.studio"},
]
keywords = [
    "security", "audit", "ubuntu", "linux", "hardening",
    "compliance", "forensics", "incident-response", "cis-benchmarks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/Type-3-studio/usaf"
Repository = "https://github.com/Type-3-studio/usaf"
Documentation = "https://github.com/Type-3-studio/usaf#readme"
Changelog = "https://github.com/Type-3-studio/usaf/releases"
Issues = "https://github.com/Type-3-studio/usaf/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.0",
]
html = [
    "jinja2>=3.0",
]
sarif = [
    "sarif-om>=1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings>=0.25",
]
all = [
    "usaf[dev,html,sarif,docs]",
]

[project.scripts]
usaf = "usaf.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["usaf*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    # === Core correctness ===
    "E",    # pycodestyle errors
    "F",    # Pyflakes — logic errors, undefined names
    "W",    # pycodestyle warnings
    "I",    # isort — import ordering
    "N",    # pep8-naming — naming conventions
    "UP",   # pyupgrade — modern Python syntax
    "B",    # flake8-bugbear — bug detection
    "SIM",  # flake8-simplify — simpler expressions
    "RUF",  # Ruff-specific rules
    "PL",   # Pylint — opinionated style and logic

    # === Unused code detection ===
    "ARG",  # flake8-unused-arguments

    # === Security & correctness ===
    "T10",  # flake8-debugger — no debugger breakpoints in committed code
    "T20",  # flake8-print — no print() outside CLI entry points

    # === Modernization ===
    "FA",   # flake8-future-annotations — from __future__ import annotations
    "C4",   # flake8-comprehensions — idiomatic dict/list/set comprehensions
]
ignore = [
    "PLR2004",  # Magic-value-in-comparison — acceptable for security thresholds & limits
    "PLR0913",  # Too-many-arguments — framework APIs (plugins, models) need flexibility
    "E501",     # Line-length — handled by ruff formatter
    "RUF012",   # Mutable-class-default — intentionally used across 389 check plugin classes
                # as design-time configuration constants (e.g., _WEAK_TYPES = {"dsa"}).
                # This is the architectural pattern for the plugin system, not a bug.
]

[tool.ruff.lint.per-file-ignores]
# CLI entry point — uses print() for interactive user output
"src/usaf/cli/app.py" = ["T201"]
# Scan runner — uses print() for progress/status output
"src/usaf/core/runner.py" = ["T201"]
# Tests — local imports and path manipulation are common test patterns
"tests/**" = ["PLC0415", "E402"]
# Test-lab utility scripts — CLI tools, not part of the library API
"test_lab/**" = ["T201", "PLC0415", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["usaf"]

[tool.ruff.format]
quote-style = "double"
# docstring-code-format deliberately omitted for now:
# would reformat ~182 files' docstring examples. Enable in a dedicated formatting pass.

[tool.mypy]
strict = true
python_version = "3.13"
warn_unused_configs = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["usaf.models.severity"]
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = ["usaf.checks.*", "usaf.collectors.*", "usaf.cli.*"]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["usaf.baseline.*", "usaf.correlation.*", "usaf.knowledge.*"]
disallow_any_generics = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "online: marks tests requiring network (deselect with '-m \"not online\"')",
    "root: marks tests requiring root (deselect with '-m \"not root\"')",
    "golden: marks golden report tests",
]

[tool.coverage.run]
source = ["usaf"]
omit = [
    "*/tests/*",
    "*/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
]
