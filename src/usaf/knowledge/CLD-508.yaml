id: CLD-508
title: K8s Secrets on Node
threat: Kubernetes secrets stored on the node filesystem can be accessed by any process with node-level access.
fix: "Use external secrets management or KMS encryption."
cvss: "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N (5.5)"
affected_versions:
