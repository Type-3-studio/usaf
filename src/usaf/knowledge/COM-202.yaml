id: COM-202
title: Known Malicious Process
threat: Process names matching known malware, cryptominers, or C2 implants are strong indicators of compromise.
exploit: "An attacker deploys the XMRig cryptominer on a compromised server. The process 'xmrig' consumes CPU cycles mining Monero, degrading server performance."
impact: Resource theft, potential breach of sensitive data, system instability.
fix: "Kill the process, remove the binary, and investigate persistence mechanisms."
breakage: "None — these process names should never be present on a legitimate system."
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (9.8)"
affected_versions:
