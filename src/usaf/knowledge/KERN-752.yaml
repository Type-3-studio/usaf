id: KERN-752
title: Module Signing Not Enforced
threat: Without module signing enforcement, arbitrary kernel modules can be loaded, enabling rootkits.
fix: "Add module.sig_enforce=1 to GRUB_CMDLINE_LINUX and run update-grub."
