id: LOG-502
title: Auditd Log Exhaustion Risk
threat: Unbounded audit logs filling disk space and causing system service failures.
exploit: 'Attacker triggers verbose auditing events to fill disk space, causing the system to crash or services to fail (denial of service).'
impact: Disk exhaustion leading to system instability, service failures, and inability to write new audit events during a critical incident.
fix: 'Configure log rotation in /etc/audit/auditd.conf: max_log_file = 100 (MB), num_logs = 5, max_log_file_action = ROTATE. Monitor disk usage with alerts.'
breakage: Aggressive rotation may discard audit logs before they can be reviewed. Ensure adequate retention for compliance requirements.
cvss: "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H (5.5)"
affected_versions:
  - "Ubuntu 20.04"
  - "Ubuntu 22.04"
  - "Ubuntu 24.04"
  - "Ubuntu 26.04"
false_positive_rate: 0.1
known_exceptions:
  - "Systems forwarding logs to remote syslog with local retention not required"
  - "Systems with very large disks and active monitoring rotation"
related_findings:
  - "FOR-101"
  - "LOG-501"
severity_override: null
tags:
  - "auditing"
  - "logs"
  - "disk-space"
  - "rotation"
mitre_mappings:
