id: SSH-301
title: Deprecated DSA Host Key
threat: DSA SSH keys are deprecated due to known weaknesses and are disabled by default in OpenSSH 9.x.
fix: "Generate a new Ed25519 host key: ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key"
breakage: "Old SSH clients that only support DSA will not be able to connect."
