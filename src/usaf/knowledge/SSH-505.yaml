id: SSH-505
title: SSH GSSAPIAuthentication Enabled
threat: GSSAPI authentication uses Kerberos tickets. If Kerberos is not required, it adds unnecessary attack surface.
fix: "Set 'GSSAPIAuthentication no' in sshd_config if Kerberos is not needed"
