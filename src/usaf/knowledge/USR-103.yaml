id: USR-103
title: "Security Check"
threat: "User account misconfigurations allow unauthorized access and privilege escalation."
exploit: "Attackers exploit dormant accounts, excessive group memberships, or weak home directory permissions."
impact: "Unauthorized access, lateral movement, and privilege escalation."
fix: "Audit user accounts, remove unnecessary privileges, and lock inactive accounts."
breakage: "Locking accounts may affect legitimate users. Coordinate with stakeholders."
cvss: "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H (7.8)"
